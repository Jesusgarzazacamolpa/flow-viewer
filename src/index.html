<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flow Viewer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'light';
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
