<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors">
  <nav class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50">
    <div class="container mx-auto flex h-14 items-center justify-between px-4">
      <a
        routerLink="/"
        class="text-lg font-bold text-sky-600 no-underline"
        >Flow Viewer</a
      >
      <div class="flex items-center gap-4 text-sm">
        <a
          routerLink="/"
          routerLinkActive="text-sky-600"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200"
          >Dashboard</a
        >
        <a
          routerLink="/shield"
          routerLinkActive="text-sky-600"
          class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200"
          >Shield</a
        >
        <a
          routerLink="/interventions"
          routerLinkActive="text-sky-600"
          class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200"
          >Intervención Humana</a
        >
        <button
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
          class="rounded-md p-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700/50 transition-colors"
        >
          <span class="text-xl">{{ themeIcon() }}</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-6">
    <router-outlet />
  </main>
</div>
