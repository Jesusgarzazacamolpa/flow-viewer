<div class="relative" #dropdownContainer>
  <button
    type="button"
    (click)="toggleDropdown()"
    [class.cursor-not-allowed.opacity-50]="disabled()"
    class="w-full px-3 py-2 text-sm text-slate-800 dark:text-slate-200 bg-white dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 rounded-md focus:outline-none flex items-center justify-between gap-2"
  >
    <span class="truncate flex-1">
      {{ selectedLabel() || placeholder() }}
    </span>
    <span class="w-4 h-4 text-slate-500 dark:text-slate-400 flex-shrink-0 transition-transform" [class.rotate-180]="isOpen()">
      ▼
    </span>
  </button>

  <div *ngIf="isOpen()" class="absolute z-50 mt-1 w-full max-h-60 overflow-auto rounded-md border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg">
    <div class="p-2 border-b border-slate-200 dark:border-slate-700">
      <input
        type="text"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        (keydown.esc)="closeDropdown()"
        (keydown.arrowDown)="focusFirstOption()"
        placeholder="Buscar..."
        class="w-full px-3 py-2 text-sm text-slate-800 dark:text-slate-200 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-md focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
        aria-label="Filtrar opciones"
      />
    </div>

    <div class="max-h-48 overflow-auto">
      <div *ngIf="filteredOptions().length === 0" class="px-3 py-2 text-sm text-slate-500 dark:text-slate-500 text-center">
        {{ noResultsText() }}
      </div>
      <ul *ngIf="filteredOptions().length > 0" role="listbox" class="py-1">
        <li
          *ngFor="let option of filteredOptions(); trackBy: trackByValue"
          role="option"
          (click)="selectOption(option)"
          (keydown.enter)="selectOption(option)"
          (keydown.esc)="closeDropdown()"
          [class.bg-sky-600]="isSelected(option)"
          [class.text-white]="isSelected(option)"
          class="px-3 py-2 text-sm cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors flex items-center gap-2"
          tabindex="0"
        >
          <span class="truncate">{{ option.label }}</span>
          <span *ngIf="isSelected(option)" class="w-4 h-4 flex-shrink-0 text-current">
            ✓
          </span>
        </li>
      </ul>
    </div>

    <button
      *ngIf="showCreateOption()"
      type="button"
      (click)="createNew.emit(searchTerm())"
      class="w-full px-3 py-2 text-sm text-sky-600 dark:text-sky-400 hover:text-sky-800 dark:hover:text-sky-300 flex items-center gap-2 border-t border-slate-200 dark:border-slate-700 pt-2"
    >
      <span class="w-4 h-4">+</span>
      Crear "{{ searchTerm() }}"
    </button>
  </div>
</div>
