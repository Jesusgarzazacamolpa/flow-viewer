<nav aria-label="Línea de tiempo de pasos">
  <ol class="relative border-l border-slate-300 dark:border-slate-700 pl-1">
    <li
      *ngFor="let step of steps; let i = index; let last = last"
      class="mb-6 ml-6"
    >
      <div
        class="absolute -left-3.5 flex h-9 w-9 items-center justify-center rounded-lg border-2 transition-all duration-200"
        [ngClass]="dotBorderClass(step.status)"
      >
        <button
          type="button"
          (click)="toggleExpanded(i)"
          [attr.aria-expanded]="isExpanded(i)"
          class="relative flex h-7 w-7 items-center justify-center rounded-md hover:bg-slate-200 dark:hover:bg-slate-700/50 transition-colors"
        >
          <app-icon
            *ngIf="!isExpanded(i)"
            name="folder"
            size="sm"
            colorClass="text-slate-600 dark:text-slate-400"
          />
          <app-icon
            *ngIf="isExpanded(i)"
            name="folder-open"
            size="sm"
            colorClass="text-sky-600 dark:text-sky-400"
          />

          <span
            class="absolute -bottom-0.5 -right-0.5 flex h-4 w-4 items-center justify-center rounded-full"
            [ngClass]="dotInnerClass(step.status)"
          >
            <app-icon
              [name]="statusIconName(step.status)"
              size="xs"
              colorClass="text-white"
              [strokeWidth]="2.5"
            />
          </span>
        </button>
      </div>

      <div class="flex items-start justify-between gap-3">
        <div class="flex-1">
          <p class="text-sm font-medium text-slate-800 dark:text-slate-200">{{ step.name }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-500">Orden {{ step.stepOrder }}</p>
        </div>
      <app-status-badge [status]="step.status" />
      <button
        *ngIf="canRetry(step.status)"
        (click)="retryStep.emit(step.stepOrder)"
        class="rounded-md bg-red-600 px-2 py-1 text-xs font-medium text-white hover:bg-red-700 transition-colors"
        title="Reintentar paso"
      >
        <app-icon name="arrow-path" size="xs" />
      </button>
    </div>

      <div
        *ngIf="step.errorMessage"
        class="mt-2 rounded-md border border-red-200 dark:border-red-900/30 bg-red-50 dark:bg-red-950/30 px-3 py-2 text-sm text-red-800 dark:text-red-300"
      >
        {{ step.errorMessage }}
      </div>

      <div
        *ngIf="isExpanded(i)"
        class="step-details"
      >
        <div class="grid grid-cols-[120px_1fr] gap-2">
          <span class="flex items-center gap-1.5 text-slate-500 dark:text-slate-500">
            <app-icon name="tag" size="sm" /> ID
          </span>
          <span class="font-mono text-slate-700 dark:text-slate-300">{{ step.id }}</span>

          <span class="flex items-center gap-1.5 text-slate-500 dark:text-slate-500">
            <app-icon name="arrow-path" size="sm" /> Intentos
          </span>
          <span class="text-slate-700 dark:text-slate-300">{{ step.retryCount || 0 }}</span>

          <span class="flex items-center gap-1.5 text-slate-500 dark:text-slate-500">
            <app-icon name="clock" size="sm" /> Iniciado
          </span>
          <span class="text-slate-700 dark:text-slate-300">{{ step.startedAt || '—' }}</span>

          <span class="flex items-center gap-1.5 text-slate-500 dark:text-slate-500">
            <app-icon name="check" size="sm" /> Completado
          </span>
          <span class="text-slate-700 dark:text-slate-300">{{ step.completedAt || '—' }}</span>
        </div>
      </div>

      <div
        *ngIf="last; else other"
        class="mt-2 text-xs text-slate-500 dark:text-slate-600"
      ></div>

      <ng-template #other>
        <div class="mt-2 h-px bg-slate-300 dark:bg-slate-800"></div>
      </ng-template>
    </li>
  </ol>
</nav>
