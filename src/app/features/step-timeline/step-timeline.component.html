<nav aria-label="Progress">
  <ol class="relative border-l border-slate-300 dark:border-slate-700 pl-1">
    <li
      *ngFor="let step of steps; let i = index; let last = last"
      class="mb-8 ml-5"
    >
      <div
        class="absolute -left-1.5 flex h-6 w-6 items-center justify-center rounded-full border-2"
        [ngClass]="dotBorderClass(step.status)"
      >
        <span
          class="h-2.5 w-2.5 rounded-full"
          [ngClass]="dotInnerClass(step.status)"
        ></span>
      </div>

      <div class="flex items-start justify-between gap-3">
        <div class="flex-1">
          <p class="text-sm font-medium text-slate-800 dark:text-slate-200">{{ step.name }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-500">Orden {{ step.stepOrder }}</p>
        </div>
        <app-status-badge [status]="step.status" />
      </div>

      <div
        *ngIf="step.errorMessage"
        class="mt-2 rounded-md border border-red-200 dark:border-red-900/30 bg-red-50 dark:bg-red-950/30 px-3 py-2 text-sm text-red-800 dark:text-red-300"
      >
        {{ step.errorMessage }}
      </div>

      <div
        *ngIf="last; else other"
        class="mt-2 text-xs text-slate-500 dark:text-slate-600"
      ></div>

      <ng-template #other>
        <div class="mt-2 h-px bg-slate-300 dark:bg-slate-800"></div>
      </ng-template>
    </li>
  </ol>
</nav>
